name: Refresh backtest data (MSCI World EUR)

on:
  schedule:
    - cron: "0 6 2 * *"   # le 2 de chaque mois à 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/refresh-backtest-data.mjs
      - name: Commit & push if changed
        run: |
          if git diff --quiet -- src/data/msci-world-eur.json; then
            echo "Pas de changement — rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/msci-world-eur.json
          git commit -m "chore(data): refresh backtest MSCI World EUR [skip ci]"
          git push
